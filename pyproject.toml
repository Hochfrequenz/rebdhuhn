[project]
name = "rebdhuhn"
description = "Converts (already scraped) Entscheidungsbaumdiagramm tables to real graphs"
license = { text = "GPL" }
requires-python = ">=3.11"
authors = [
    { name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" },
]
keywords = ["automation", "ahb", "bdew", "ebd", "edi@energy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Build system information and other project-specific configuration below.
dependencies = [
    "pydantic>=2.0",
    "networkx",
    "requests",
    "lxml>=4.9.3",
    "svgutils",
    "efoli>=2.2.0",
    # write here line by line the dependencies for your package
]
dynamic = ["readme", "version"]

[project.urls]
Homepage = "https://github.com/Hochfrequenz/rebdhuhn"
Changelog = "https://github.com/Hochfrequenz/rebdhuhn/releases"
Repository = "https://github.com/Hochfrequenz/rebdhuhn"
Issue-Tracker = "https://github.com/Hochfrequenz/rebdhuhn/issues"

[dependency-groups]
coverage = [
    "coverage==7.15.2",
    { include-group = "tests" },
]
linting = [
    "ruff==0.16.0",
]
spellcheck = [
    "codespell==2.4.3"
]
tests = [
    "pytest==9.1.1",
    "syrupy==2026.4.6.124150327040",
    "testcontainers>=4.0.0",
    "requests-mock",
]
type_check = [
    "mypy==2.3.0",
    "types-requests==2.33.0.20260712",
    "lxml-stubs==0.5.1",
    "types-docker>=7.0.0",
    { include-group = "tests" },
]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "coverage" },
    "pre-commit",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md", "src/rebdhuhn/_version.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
# long dot/graphviz attribute strings, structurally can't be shortened
"src/rebdhuhn/graphviz.py" = ["E501"]
# __all__ is deliberately grouped by concept (with comments), not alphabetically sorted
"src/rebdhuhn/__init__.py" = ["RUF022"]
"src/rebdhuhn/models/__init__.py" = ["RUF022"]

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/rebdhuhn/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
# the following lines are needed if you would like to build a python package
# and you want to use semantic versioning
# [build-system]
# requires = ["setuptools>=41.0", "wheel", "setuptools_scm[toml]>=3.4"]
# build-backend = "setuptools.build_meta"

# [tool.setuptools_scm]
[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["snapshot: mark a test as a snapshot test"]
